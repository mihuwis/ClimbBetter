spring:
  application:
    name: climbbetter-backend

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  paths-to-match: /api/v1/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true

climbbetter:
  auth:
    mode: ${CB_AUTH_MODE:firebase}
    project-id: ${CB_FIREBASE_PROJECT_ID:}
