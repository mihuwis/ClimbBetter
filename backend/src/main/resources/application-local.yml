spring:
  datasource:
    url: ${CB_DB_URL:jdbc:postgresql://127.0.0.1:5433/climbbetter}
    username: ${CB_DB_USERNAME:climbbetter}
    password: ${CB_DB_PASSWORD:climbbetter-local}

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/local-migration

climbbetter:
  local:
    user-id: ${CB_LOCAL_USER_ID:00000000-0000-0000-0000-000000000001}
